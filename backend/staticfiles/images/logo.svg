<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
  
  <!-- Trash bin body -->
  <rect x="30" y="35" width="40" height="45" rx="3" fill="#2E7D32"/>
  
  <!-- Trash bin lid -->
  <rect x="28" y="28" width="44" height="8" rx="2" fill="#2E7D32"/>
  <line x1="32" y1="28" x2="32" y2="35" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="68" y1="28" x2="68" y2="35" stroke="#2E7D32" stroke-width="1.5"/>
  
  <!-- Recycle symbol inside trash bin (curved arrows) -->
  <!-- Arrow 1 (top) -->
  <path d="M 45 45 L 50 40 L 55 45" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 40 Q 55 38 58 42" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Arrow 2 (bottom-left) -->
  <path d="M 42 58 L 38 52 L 40 47" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 38 52 Q 35 50 33 54" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Arrow 3 (bottom-right) -->
  <path d="M 58 58 L 62 52 L 60 47" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 62 52 Q 65 50 67 54" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="50" cy="52" r="2" fill="#66BB6A"/>
</svg>
