<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Reports Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .dashboard-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .dashboard-header p {
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #10b981;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #10b981;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .table-header {
            background: #f0fdf4;
            border-bottom: 2px solid #d1fae5;
            padding: 1.5rem;
        }

        .table-header h2 {
            font-size: 1.3rem;
            color: #059669;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f9fafb;
            padding: 1rem 1.5rem;
            text-align: left;
            font-weight: 600;
            color: #059669;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.9rem;
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #f3f4f6;
        }

        tr:hover {
            background: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-general {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-organic {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-recyclable {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        .badge-hazardous {
            background: #fecaca;
            color: #7f1d1d;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-view {
            background: #10b981;
            color: white;
        }

        .btn-view:hover {
            background: #059669;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .dashboard {
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            th, td {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <h1>♻️ Waste Reports Dashboard</h1>
            <p>Monitor and manage community waste reports</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Reports</h3>
                <div class="value" id="total-reports">0</div>
            </div>
            <div class="stat-card">
                <h3>This Month</h3>
                <div class="value" id="month-reports">0</div>
            </div>
            <div class="stat-card">
                <h3>This Week</h3>
                <div class="value" id="week-reports">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Shehias</h3>
                <div class="value" id="active-shehias">0</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Recent Reports</h2>
            </div>
            <table id="reports-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Shehia</th>
                        <th>Bin</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th>Reported At</th>
                        <th>Comment</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reports-body">
                    <tr>
                        <td colspan="8" class="empty-state">
                            <p>Loading reports...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        // Fetch and display reports
        async function loadReports() {
            try {
                const response = await fetch(`${API_BASE}/reports/list/`);
                const data = await response.json();

                if (data.success && data.data) {
                    displayReports(data.data);
                    updateStats(data.data);
                }
            } catch (error) {
                console.error('Error loading reports:', error);
                document.getElementById('reports-body').innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <p>Error loading reports. Please check your connection.</p>
                        </td>
                    </tr>
                `;
            }
        }

        function displayReports(reports) {
            const tbody = document.getElementById('reports-body');

            if (reports.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <p>No reports yet. Check back later!</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = reports.map(report => `
                <tr>
                    <td>#${report.id}</td>
                    <td><strong>${report.shehia__name}</strong></td>
                    <td>${report.bin__name}</td>
                    <td><span class="badge badge-${report.bin__location.toLowerCase().replace(/\s+/g, '-')}">
                        ${report.bin__location}
                    </span></td>
                    <td>${report.bin__location}</td>
                    <td>${new Date(report.submitted_at).toLocaleString()}</td>
                    <td>${report.comment ? report.comment.substring(0, 50) + '...' : 'N/A'}</td>
                    <td class="actions">
                        <button class="btn-small btn-view" onclick="viewReport(${report.id})">View</button>
                        <button class="btn-small btn-delete" onclick="deleteReport(${report.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(reports) {
            const now = new Date();
            const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const thisWeek = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

            const monthCount = reports.filter(r => 
                new Date(r.submitted_at) >= thisMonth
            ).length;

            const weekCount = reports.filter(r => 
                new Date(r.submitted_at) >= thisWeek
            ).length;

            const shehias = new Set(reports.map(r => r.shehia__name)).size;

            document.getElementById('total-reports').textContent = reports.length;
            document.getElementById('month-reports').textContent = monthCount;
            document.getElementById('week-reports').textContent = weekCount;
            document.getElementById('active-shehias').textContent = shehias;
        }

        function viewReport(reportId) {
            alert(`Report #${reportId} details:\n\nGo to Django Admin (/admin) to view full details`);
        }

        async function deleteReport(reportId) {
            if (!confirm('Are you sure you want to delete this report? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/reports/${reportId}/delete/`, {
                    method: 'DELETE',
                });
                const data = await response.json();

                if (data.success) {
                    alert('Report deleted successfully');
                    loadReports();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error deleting report:', error);
                alert('Error deleting report. Please try again.');
            }
        }

        // Load reports when page loads
        loadReports();

        // Refresh every 30 seconds
        setInterval(loadReports, 30000);
    </script>
</body>
</html>
